[build]
  publish = "public"
  command = "npm run check"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]

[[redirects]]
  from = "/api/status"
  to = "/status"
  status = 200

[[redirects]]
  from = "/api/check"
  to = "/check"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/telegram"
  status = 200
