[build]
  publish = "public"
  command = "npm run check"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]

[[redirects]]
  from = "/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/check"
  to = "/.netlify/functions/check"
  status = 200
