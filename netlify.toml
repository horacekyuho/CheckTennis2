[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
  timeout = 30

[functions.check-tennis]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]

[[redirects]]
  from = "/api/status"
  to = "/status"
  status = 200

[[redirects]]
  from = "/api/check"
  to = "/check"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/telegram"
  status = 200
